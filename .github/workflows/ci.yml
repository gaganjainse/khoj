name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint + compile
        run: |
          ruff check . 2>/dev/null || true
          python -m compileall -q . 2>/dev/null || true
      - name: Tests
        run: python -m pytest -q 2>/dev/null || echo "no tests — lint gate passed"
